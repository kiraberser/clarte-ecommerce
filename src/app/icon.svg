<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#E9762B"/>
  <!-- Sun rays radiating from center -->
  <g stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity="0.5">
    <line x1="16" y1="2.5" x2="16" y2="5.5"/>
    <line x1="16" y1="26.5" x2="16" y2="29.5"/>
    <line x1="2.5" y1="16" x2="5.5" y2="16"/>
    <line x1="26.5" y1="16" x2="29.5" y2="16"/>
    <line x1="6.5" y1="6.5" x2="8.5" y2="8.5"/>
    <line x1="23.5" y1="23.5" x2="25.5" y2="25.5"/>
    <line x1="6.5" y1="25.5" x2="8.5" y2="23.5"/>
    <line x1="23.5" y1="8.5" x2="25.5" y2="6.5"/>
  </g>
  <!-- O shape as sun circle -->
  <circle cx="16" cy="16" r="7.5" fill="none" stroke="#fff" stroke-width="2.8"/>
</svg>
